name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: ruff check
        run: uvx ruff@0.15.10 check distil tests
      - name: ruff format --check (whole tree — benchmarks drifted once unwatched)
        run: uvx ruff@0.15.10 format --check .
      - name: mypy (the package ships py.typed — keep it actually typed)
        run: uvx mypy@1.17.1 --python-version 3.12 --ignore-missing-imports distil

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: census-worker validators (node:test)
        run: node --test packaging/census-worker/test/validate.test.mjs packaging/census-worker/test/beat.test.mjs
      - name: npm bridge package (node:test)
        run: node --test packaging/npm/test/runner.test.mjs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      # aiohttp + pytest-asyncio so the async proxy (distil/aproxy.py, the
      # [async] extra) is exercised and counted. Genuinely-external code (torch
      # training loop, live-model proof-harness runners) is omitted in
      # [tool.coverage.run] — see the justification there. Floor climbs as
      # coverage does; it may only ratchet up, never erode.
      # opentelemetry-sdk so the trace/counter EXPORT assertions actually run:
      # those tests importorskip, so without the SDK they silently skip and an
      # export that reports zeros would keep CI green.
      - name: pytest with coverage floor
        run: uv run --with pytest --with pytest-asyncio --with aiohttp --with pytest-cov --with opentelemetry-sdk python -m pytest -q --cov=distil --cov-fail-under=95

  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # 3.9 is the floor (what macOS ships as system python3) — keep it green so
        # `pipx install distil-llm` works on stock Python, not just newer ones.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          # The classifier says OS Independent and the code carries Windows
          # guards (fcntl/termios/SIGPIPE) — this is what proves they work.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: uv run --with pytest python -m pytest -q
      - name: Non-inferiority gate (every domain must certify)
        run: uv run distil bench
      - name: Byte-fidelity gate (reversible + append-only)
        run: uv run distil verify
      - name: Adversarial real-path gate (invariants on hostile inputs)
        run: uv run distil validate
      # Fact-level recall on the corpus: zero cost (no LLM, no API key, no network), so
      # it is a mandatory per-commit gate rather than a nightly. Tier-0/1 are lossless
      # by construction, so ANY unrecoverable fact is a real regression.
      - name: Fact-retention gate (recall on the corpus)
        run: uv run distil retention --max-lost 0
      # Everything above imports distil from the source tree. This builds the wheel,
      # installs it clean, and drives the console scripts + server.json launch spec the
      # way a user's MCP client does — the boundary that shipped a broken registry
      # entry under a fully green suite.
      - name: Packaging smoke (shipped artifact, not the source tree)
        run: uv run --with pytest python -m pytest tests/test_packaging_smoke.py -q

  # The image publishes ENTRYPOINT ["distil"] + CMD ["bench"] and nothing ever ran
  # it. The static check in the packaging smoke proves the entrypoint NAMES a real
  # script; this proves the built image actually executes it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t distil:ci .
      - name: Entrypoint runs and reports the shipped version
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          OUT="$(docker run --rm distil:ci --version)"
          echo "image reports: $OUT (expected $VERSION)"
          case "$OUT" in *"$VERSION"*) ;; *) echo "::error::image reports $OUT, pyproject says $VERSION"; exit 1 ;; esac
      - name: Default CMD (bench) certifies inside the image
        run: docker run --rm distil:ci bench

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo test
        run: cargo test --manifest-path rust/distil-core/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path rust/distil-core/Cargo.toml -- -D warnings
