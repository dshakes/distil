# Nightly LIVE decision-equivalence gate (regression tripwire).
#
# The per-commit CI gates (`distil bench` / `verify` / `validate`) grade against the
# offline DeterministicRunner — a synthetic oracle over the committed corpus. This job
# closes the honesty gap: it re-certifies the same corpus against a REAL model
# (`--runner anthropic`), budget-capped so an unattended run can never spend silently.
#
# Methodology (why these flags — each one was forced by a real live run):
#   * ONE pooled TOST over every turn of every corpus trajectory — per-trajectory
#     verdicts on a stochastic grader are underpowered (a handful of turns cannot
#     separate compression divergence from the model's own run-to-run variance;
#     observed live: verdicts flipped between identical runs).
#   * --samples 3 majority vote per decision, plus the A/A self-agreement control
#     (on by default for live runs): a turn where the model disagrees with ITSELF
#     across draws cannot indict compression — the shadow v2->v3 lesson (observed
#     live: a 75% A/A floor on coding-bugfix; against it, compression added zero
#     excess divergence).
#   * --margin 0.10 is the LIVE regression margin, deliberately wider than the
#     offline 0.02 proof margin: it reflects live sampling noise at pooled n≈30.
#     This job answers "did a change break live equivalence?", it is NOT the
#     source of the headline claims (those are the n=200/n=500 real-trace results
#     in the README, graded at scale).
#
# Cost envelope: 3 contexts per turn (A, second A draw for the control, B) x
# --samples 3, on a cheap model, under one hard --max-live-calls ceiling for the
# whole pooled run (the run FAILS at the ceiling rather than continuing to spend).

name: live-cert

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-certify:
    runs-on: ubuntu-latest
    # Secrets are unavailable on forks; keep the job out of fork CI noise.
    if: github.repository == 'dshakes/distil'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LIVE_CERT_MODEL: claude-haiku-4-5-20251001
      MAX_LIVE_CALLS: "400"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Guard — skip cleanly when no API key is configured
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not configured — live gate skipped (synthetic per-commit gates still cover main)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pooled live certify over the whole corpus (budget-capped, A/A-controlled)
        if: steps.key.outputs.present == 'true'
        run: |
          set -o pipefail
          mkdir -p live-cert-reports
          uv run --with anthropic distil certify -t corpus/ \
               --runner anthropic \
               --model "$LIVE_CERT_MODEL" \
               --max-live-calls "$MAX_LIVE_CALLS" \
               --samples 3 \
               --margin 0.10 \
               | tee live-cert-reports/pooled.txt
          status=$?
          {
            echo "## Nightly live decision-equivalence gate ($LIVE_CERT_MODEL, pooled corpus, A/A-controlled, margin 0.10)"
            echo '```'
            tail -20 live-cert-reports/pooled.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload reports
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-cert-reports
          path: live-cert-reports/
          retention-days: 30
