# Nightly LIVE decision-equivalence gate (regression tripwire).
#
# The per-commit CI gates (`distil bench` / `verify` / `validate`) grade against the
# offline DeterministicRunner — a synthetic oracle over the committed corpus. This job
# closes the honesty gap: it grades SERVING SEMANTICS on real agent traces (12 τ-bench
# + 6 SWE-bench committed fixtures in benchmarks/fixtures/) via benchmarks/prove.py,
# the non-circular harness that grounds decisions in a real model rather than in a
# planted DECISION: oracle marker.
#
# Why distil certify -t corpus/ --runner anthropic was retired for nightly use:
#   Two replicated opus-graded runs showed the synthetic-corpus + harsher-than-serving
#   strategy condition diverges (~11-21%) beyond the model's own A/A self-agreement
#   floor (92.9-100% for opus), producing a gate that measures a condition production
#   never exhibits.
#   See docs/EVALUATION.md "Live grading of the synthetic-corpus gate" for the full
#   analysis and the decision to repoint at serving semantics via prove.py.
#
# Methodology:
#   * benchmarks/prove.py grades real τ-bench + SWE-bench traces (no DECISION: markers)
#     via the same conformal certification machinery the paper uses (E1/E2/E3/E4).
#   * --samples 3 majority vote per decision: absorbs grader run-to-run variance so
#     the decision-change rate reflects compression divergence, not model noise.
#   * Disk-cached decisions (benchmarks/.cache/): after the first live run the E2
#     result is deterministic — re-running replays from cache. The GATE (E2) is
#     stable by construction. The report's raw E1/E4 per-turn rates carry the
#     grader's variance term (byte-exact reads 0% via cache-key sharing, not as a
#     measured floor); add `--aa-control` to report each level's excess above the
#     grader's A/A self-agreement floor (off here to stay within the call budget;
#     see docs/EVALUATION.md 2.1).
#   * --ladder quick (4 rungs): cuts live calls from ~1 000 (full ladder) to 396
#     (132 unique context pairs × 3 samples, cold cache). Subsequent runs: 0 new calls.
#   * --gate exits non-zero when E2 violates: certified_frac=0, coverage<1-δ, or
#     mean_realized_risk>α. Stable run-to-run due to caching.
#   * --max-live-calls hard ceiling: the run fails loudly at the budget instead of
#     spending silently (mirrors AnthropicRunner.max_calls).
#
# Cost envelope: ≤450 live API calls per cold run (quick ladder × 3 samples × 18
# fixtures trajectories, with deduplication). Warm runs cost nothing (all cached).

name: live-cert

on:
  # Cron re-enabled 2026-07-17 after the repointed gate's first green
  # workflow_dispatch (run 29548074605: GATE PASS on real-model grading).
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-certify:
    runs-on: ubuntu-latest
    # Secrets are unavailable on forks; keep the job out of fork CI noise.
    if: github.repository == 'dshakes/distil'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LIVE_CERT_MODEL: claude-haiku-4-5-20251001
      # ≤450 live API calls per cold run (132 unique context pairs × 3 samples,
      # quick ladder, 18 fixture trajectories). Warm runs cost nothing (all cached).
      MAX_LIVE_CALLS: "450"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - name: Guard — skip cleanly when no API key is configured
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not configured — live gate skipped (synthetic per-commit gates still cover main)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Live serving-semantics gate via prove.py (budget-capped, disk-cached decisions)
        if: steps.key.outputs.present == 'true'
        run: |
          set -o pipefail
          mkdir -p live-cert-reports
          uv run --with anthropic python benchmarks/prove.py \
               --dataset fixtures \
               --runner anthropic \
               --model "$LIVE_CERT_MODEL" \
               --samples 3 \
               --ladder quick \
               --alpha 0.20 \
               --delta 0.05 \
               --max-live-calls "$MAX_LIVE_CALLS" \
               --gate \
               --report live-cert-reports/prove_report.json \
               | tee live-cert-reports/prove_stdout.txt
          status=$?
          {
            echo "## Nightly live serving-semantics gate ($LIVE_CERT_MODEL, fixtures, quick ladder, α=0.20, samples=3)"
            echo '```'
            tail -20 live-cert-reports/prove_stdout.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload reports
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: live-cert-reports
          path: live-cert-reports/
          retention-days: 30
