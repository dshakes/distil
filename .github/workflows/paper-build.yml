name: paper-build

on:
  push:
    branches: [main]
    paths:
      - "docs/paper/**"
      - ".github/workflows/paper-build.yml"
  pull_request:
    paths:
      - "docs/paper/**"
      - ".github/workflows/paper-build.yml"
  workflow_dispatch:

permissions:
  contents: write

# One in-flight build per ref; new pushes cancel the previous run.
concurrency:
  group: paper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # TeX Live full ships every package main.tex needs (tikz, pgfplots,
      # algorithm2e, cleveref, microtype...). The paper has no external images
      # and a manual thebibliography, so latexmk alone is sufficient — no
      # bibtex/biber pass required.
      - name: Compile paper
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/paper
          root_file: main.tex
          latexmk_use_xelatex: false
          # -g forces processing: CI checkouts give sources and committed PDFs
          # identical mtimes, so plain latexmk declares 'up-to-date' and skips
          # the build (observed: a dispatch run shipped a stale PDF silently).
          args: -pdf -g -interaction=nonstopmode -halt-on-error -file-line-error
          # pdflatex stamps /CreationDate and /ID with wall-clock time unless
          # told otherwise, so two builds of identical source produce
          # different PDF bytes. That made "Verify committed PDFs match
          # source" below unwinnable: every push touching docs/paper/**
          # recompiles at a new instant and diffs against whatever instant
          # the committed PDF happened to be built at, even with zero content
          # change.
          #
          # A per-commit timestamp (e.g. `git log -1 --format=%ct`) does NOT
          # fix this: the PDF has to be committed before the commit exists,
          # so its own timestamp can't be known yet when it's built, and a
          # squash or merge commit lands under a different timestamp again
          # anyway (cross-audit on this PR caught exactly that). The only
          # value both the author's local build and every future CI rebuild
          # can agree on ahead of time is a fixed constant, so pin
          # SOURCE_DATE_EPOCH via pre_compile — this action shells out to its
          # own internal `docker run` and only forwards a fixed allowlist of
          # env vars (TEXINPUTS/GITHUB_*/RUNNER_*/CI), so setting it via
          # $GITHUB_ENV in an earlier step never reaches pdflatex; pre_compile
          # runs `eval` in the same shell that then runs latexmk, so `export`
          # here is what actually takes effect. The value has no calendar
          # meaning — bump it (and rebuild+commit both PDFs) only if the repo
          # ever wants to change it; there's no other reason to touch it.
          #
          # SOURCE_DATE_EPOCH alone only overrides pdflatex's own /CreationDate
          # and /ID metadata — both papers also render \date{\today} into the
          # visible title (main.tex, main_neurips.tex), and \today reads TeX's
          # \year/\month/\day primitives, which track real wall-clock time
          # unless FORCE_SOURCE_DATE=1 is also set. Without it the rendered
          # page content itself drifts a day at a time even with the epoch
          # pinned (cross-audit on this PR caught this by diffing the visible
          # date against the pinned metadata).
          pre_compile: export SOURCE_DATE_EPOCH=1700000000 FORCE_SOURCE_DATE=1

      - name: Compile NeurIPS variant
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/paper
          root_file: main_neurips.tex
          latexmk_use_xelatex: false
          # -g forces processing: CI checkouts give sources and committed PDFs
          # identical mtimes, so plain latexmk declares 'up-to-date' and skips
          # the build (observed: a dispatch run shipped a stale PDF silently).
          args: -pdf -g -interaction=nonstopmode -halt-on-error -file-line-error
          pre_compile: export SOURCE_DATE_EPOCH=1700000000 FORCE_SOURCE_DATE=1

      # Staleness check, NOT an auto-commit. This job used to rebuild the PDFs and
      # send them straight to main, which a branch ruleset requiring status checks
      # can never satisfy: a direct write creates no check runs, so the rule has
      # nothing to wait on and rejects it permanently (#128). It was downgraded to
      # a warning in #130 to stop CI going red; this removes the write entirely.
      #
      # The three ways to keep auto-committing all cost more than they are worth:
      # exempting the bot from the ruleset weakens a protection that was enabled on
      # purpose, and the PR + auto-merge route needs a PAT with write access living
      # in repo secrets. Neither is a fair trade for a convenience commit.
      #
      # So: PRs verify the PDFs compile (the step above), and main verifies they are
      # in sync. If they drift, this FAILS with the command to fix it, rather than
      # silently fixing it for you. Committing the rebuilt PDF is the author's job,
      # the same as any other build artifact this repo tracks.
      - name: Verify committed PDFs match source
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          cd docs/paper
          if ! git diff --quiet -- main.pdf main_neurips.pdf; then
            echo "::error title=paper PDFs are stale::The committed PDFs do not match the LaTeX source. Rebuild and commit them: cd docs/paper && SOURCE_DATE_EPOCH=1700000000 FORCE_SOURCE_DATE=1 latexmk -pdf -g main.tex main_neurips.tex && git add main.pdf main_neurips.pdf"
            git diff --stat -- main.pdf main_neurips.pdf
            exit 1
          fi
          echo "PDFs match source."

      # Visual-polish triage: undefined refs/citations and overfull/underfull
      # boxes don't fail a -halt-on-error build, so surface them as annotations
      # instead. Adjust to `exit 1` here if the repo decides these should block.
      - name: Surface LaTeX warnings
        if: always()
        working-directory: docs/paper
        run: |
          log=main.log
          [ -f "$log" ] || { echo "no log file produced"; exit 0; }
          grep -nE 'LaTeX Warning: (Reference|Citation)|There were undefined references' "$log" \
            | while IFS= read -r line; do echo "::warning title=Undefined ref/citation::$line"; done || true
          grep -nE 'Overfull \\[hv]box|Underfull \\[hv]box' "$log" \
            | while IFS= read -r line; do echo "::warning title=Over/underfull box::$line"; done || true
          echo "Warning triage complete (non-blocking)."

      - name: Upload paper PDF
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: distil-paper-pdf
          path: docs/paper/main.pdf
          if-no-files-found: error

      # On failure, ship the .log so the break is diagnosable without a local
      # TeX toolchain.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: distil-paper-log
          path: docs/paper/main.log
          if-no-files-found: warn
