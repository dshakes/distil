{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distil-gateway.fullname" . }}
  labels: {{- include "distil-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "distil-gateway.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: {{ .Values.gateway.port }}
          protocol: TCP
  egress:
    # DNS, then HTTPS to the upstream provider. Nothing else: a compression proxy
    # that can reach arbitrary hosts is an exfiltration path.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- if .Values.networkPolicy.egressTo }}
        {{- toYaml .Values.networkPolicy.egressTo | nindent 8 }}
        {{- else }}
        # A ports-only rule has no `to:` selector, which in NetworkPolicy
        # semantics means EVERY destination on that port — the opposite of what
        # the comment above claims. The default below is the narrowest selector
        # that still works without knowing the operator's provider: the public
        # internet minus every private range, so a compromised pod cannot reach
        # the cluster, the node, or a cloud metadata service on 443. Narrow it
        # further to your provider's addresses via `networkPolicy.egressTo`.
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicy.egressExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
{{- end }}
