<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter,ui-sans-serif,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="cmT cmD">
  <title id="cmT">Choosing a distil mode from two questions</title>
  <desc id="cmD">A decision tree with two questions. The first question is how you pay. If you pay per use with an API key, the recommended mode is distil wrap, which puts distil invisibly between your coding assistant and the provider and cuts the bill directly. If you pay a flat monthly subscription there is no per-token bill, so the recommendation is distil hook install, which lets Claude Code compress its own tool output in-process and buys back rate-limit headroom instead. The second question is what you are running: a coding assistant in a terminal points to wrap or hook, an application you are building points to the proxy or the in-process library, Claude Desktop points to the MCP server, and a whole team points to the gateway. A footer notes that every mode saves according to the shape of the tool output rather than the mode chosen: verbose JSON compresses 28 to 33 percent, repeated log lines up to 99 percent, and ordinary prose about 0 percent.</desc>
  <defs>
    <marker id="cmA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7390"/>
    </marker>
    <marker id="cmAo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ad1c9"/>
    </marker>
    <style>
      @keyframes cmRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      @keyframes cmDraw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
      @keyframes cmGlow{0%,100%{opacity:.5}50%{opacity:1}}
      .cmN{transform-box:fill-box;transform-origin:center;animation:cmRise .6s cubic-bezier(.2,.75,.25,1) both}
      .cmQ1{animation-delay:.05s}
      .cmL{animation-delay:.35s} .cmR{animation-delay:.35s}
      .cmB1{animation-delay:.62s} .cmB2{animation-delay:.72s}
      .cmB3{animation-delay:.82s} .cmB4{animation-delay:.92s}
      .cmFoot{animation-delay:1.1s}
      .cmW{stroke-dasharray:120;animation:cmDraw .45s ease-out both}
      .cmW1{animation-delay:.28s} .cmW2{animation-delay:.28s}
      .cmDot{animation:cmGlow 2.6s ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){
        .cmN,.cmW,.cmDot{animation:none}
        .cmW{stroke-dasharray:none}
      }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#0b0d15"/>

  <!-- Question 1 -->
  <g class="cmN cmQ1">
    <rect x="430" y="26" width="340" height="62" rx="12" fill="#151826" stroke="#8b7bff"/>
    <text x="600" y="52" fill="#8b7bff" font-size="11.5" text-anchor="middle" font-weight="600" letter-spacing="0.1em">START HERE</text>
    <text x="600" y="74" fill="#f2f3f7" font-size="15" text-anchor="middle" font-weight="600">How do you pay for AI?</text>
  </g>

  <path class="cmW cmW1" d="M540 88 L330 128" stroke="#6b7390" stroke-width="2" fill="none" marker-end="url(#cmA)"/>
  <path class="cmW cmW2" d="M660 88 L870 128" stroke="#5ad1c9" stroke-width="2" fill="none" marker-end="url(#cmAo)"/>

  <!-- Left: metered -->
  <g class="cmN cmL">
    <rect x="120" y="132" width="420" height="128" rx="12" fill="#12151f" stroke="#262d4a"/>
    <text x="146" y="160" fill="#8b91a3" font-size="12" font-weight="600">💳  Pay per use — you have an API key</text>
    <text x="146" y="186" fill="#f2f3f7" font-size="17" font-weight="600">distil wrap -- claude</text>
    <text x="146" y="210" fill="#8b91a3" font-size="12.5">Sits invisibly between your assistant and the provider.</text>
    <text x="146" y="230" fill="#8b91a3" font-size="12.5">Nothing about how you work changes.</text>
    <text x="146" y="250" fill="#5ad1c9" font-size="12.5" font-weight="600">→ comes straight off the bill</text>
  </g>

  <!-- Right: subscription -->
  <g class="cmN cmR">
    <rect x="660" y="132" width="420" height="128" rx="12" fill="#141a2e" stroke="#5ad1c9"/>
    <text x="686" y="160" fill="#8b91a3" font-size="12" font-weight="600">🎟️  Flat monthly — Pro / Max subscription</text>
    <text x="686" y="186" fill="#f2f3f7" font-size="17" font-weight="600">distil hook --install</text>
    <text x="686" y="210" fill="#8b91a3" font-size="12.5">Claude Code shrinks its own tool output before reading it.</text>
    <text x="686" y="230" fill="#8b91a3" font-size="12.5">No proxy, nothing touches your login.</text>
    <text x="686" y="250" fill="#5ad1c9" font-size="12.5" font-weight="600">→ more room before you hit your limit</text>
  </g>

  <text x="600" y="300" fill="#8b91a3" font-size="13" text-anchor="middle">and if you&#8217;re not at a terminal at all &#8212;</text>

  <!-- Question 2 row -->
  <g class="cmN cmB1">
    <rect x="70" y="326" width="248" height="118" rx="12" fill="#12151f" stroke="#262d4a"/>
    <text x="194" y="354" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">🖥️  Coding assistant</text>
    <text x="194" y="378" fill="#8b91a3" font-size="12" text-anchor="middle">Claude Code, Codex, Gemini,</text>
    <text x="194" y="396" fill="#8b91a3" font-size="12" text-anchor="middle">Aider, Goose&#8230;</text>
    <text x="194" y="424" fill="#5ad1c9" font-size="13" text-anchor="middle" font-weight="600">wrap  ·  hook</text>
  </g>

  <g class="cmN cmB2">
    <rect x="338" y="326" width="248" height="118" rx="12" fill="#12151f" stroke="#262d4a"/>
    <text x="462" y="354" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">🧱  An app you&#8217;re building</text>
    <text x="462" y="378" fill="#8b91a3" font-size="12" text-anchor="middle">Any language: point your</text>
    <text x="462" y="396" fill="#8b91a3" font-size="12" text-anchor="middle">base URL at distil</text>
    <text x="462" y="424" fill="#5ad1c9" font-size="13" text-anchor="middle" font-weight="600">proxy  ·  library</text>
  </g>

  <g class="cmN cmB3">
    <rect x="606" y="326" width="248" height="118" rx="12" fill="#12151f" stroke="#262d4a"/>
    <text x="730" y="354" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">💬  Claude Desktop</text>
    <text x="730" y="378" fill="#8b91a3" font-size="12" text-anchor="middle">Give the assistant a tool it</text>
    <text x="730" y="396" fill="#8b91a3" font-size="12" text-anchor="middle">can call when a blob is huge</text>
    <text x="730" y="424" fill="#5ad1c9" font-size="13" text-anchor="middle" font-weight="600">MCP server</text>
  </g>

  <g class="cmN cmB4">
    <rect x="874" y="326" width="248" height="118" rx="12" fill="#12151f" stroke="#262d4a"/>
    <text x="998" y="354" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">🏢  A whole team</text>
    <text x="998" y="378" fill="#8b91a3" font-size="12" text-anchor="middle">One shared service,</text>
    <text x="998" y="396" fill="#8b91a3" font-size="12" text-anchor="middle">per-team accounting</text>
    <text x="998" y="424" fill="#5ad1c9" font-size="13" text-anchor="middle" font-weight="600">gateway</text>
  </g>

  <!-- Footer: the shape truth -->
  <g class="cmN cmFoot">
    <rect x="70" y="470" width="1052" height="62" rx="12" fill="#0c0f1d" stroke="#252c3e"/>
    <circle class="cmDot" cx="96" cy="494" r="4" fill="#ff8a6b"/>
    <text x="110" y="498" fill="#ff8a6b" font-size="12" font-weight="600">THE PART THAT DECIDES YOUR NUMBER &#8212; and it isn&#8217;t the mode</text>
    <text x="96" y="520" fill="#8b91a3" font-size="12.5">Config files &amp; API responses (JSON) <tspan fill="#5ad1c9" font-weight="600">28&#8211;33%</tspan>  ·  logs with repeated lines <tspan fill="#5ad1c9" font-weight="600">up to 99%</tspan>  ·  ordinary prose &amp; unique log lines <tspan fill="#ff8a6b" font-weight="600">~0%</tspan>  ·  a short session that never reads a big file <tspan fill="#ff8a6b" font-weight="600">~0%</tspan>, which is correct, not broken</text>
  </g>
</svg>
