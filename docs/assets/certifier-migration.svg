<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter,ui-sans-serif,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Certifier candidates on real tau-bench traffic: paired quality change and cost per case</title>
  <desc id="d">Left: for each candidate certifier, the paired change in the deployed metric (next action unchanged by compression with distil_expand recovery) against claude-opus-4-8 over 60 held-out cases, as a dot with a 95 percent interval. The pre-registered gate is a lower bound of at least minus 5 points. claude-sonnet-5-5 at low effort moves by plus 3.8 points with a lower bound of minus 4.5 and passes. claude-opus-5-5 at default effort moves by 0.0 with a lower bound of minus 10.0, at low effort by minus 0.8 with a lower bound of minus 9.8, and claude-haiku-4-5 by minus 5.8 with a lower bound of minus 15.8; none of those three clears the gate. Right: cost per case in dollars. claude-opus-4-8 costs 0.1458, claude-opus-5-5 0.1336 and 0.1256, claude-sonnet-5-5 at low effort 0.0619, claude-haiku-4-5 0.0248.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c13"/><stop offset="1" stop-color="#06070b"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151f"/><stop offset="1" stop-color="#0b0d15"/></linearGradient>
  </defs>
  <style>
    /* Whiskers and bars draw in row by row. Reduced motion gets the finished chart. */
    @media (prefers-reduced-motion: reduce) {
      animate { display: none }
      .beat { opacity: 1 !important }
    }
  </style>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <text x="48" y="52" fill="#e8eaf2" font-size="25" font-weight="700">Which model can be the certifier?</text>
  <text x="48" y="78" fill="#8b93a8" font-size="14">Real tau-bench traffic, 60 held-out cases, paired against claude-opus-4-8 on the deployed metric.</text>
  <text x="300" y="122" fill="#b9a8ff" font-size="12" font-weight="700" letter-spacing="1.2">PAIRED CHANGE, POINTS (95% CI)</text>
  <text x="800" y="122" fill="#b9a8ff" font-size="12" font-weight="700" letter-spacing="1.2">COST PER CASE, USD</text>
  <line x1="314.7" y1="140" x2="314.7" y2="436" stroke="#252c3e" stroke-width="1"/>
  <text x="314.7" y="454" text-anchor="middle" fill="#6f7688" font-size="11">-15</text>
  <line x1="388.0" y1="140" x2="388.0" y2="436" stroke="#252c3e" stroke-width="1"/>
  <text x="388.0" y="454" text-anchor="middle" fill="#6f7688" font-size="11">-10</text>
  <line x1="461.3" y1="140" x2="461.3" y2="436" stroke="#252c3e" stroke-width="1"/>
  <text x="461.3" y="454" text-anchor="middle" fill="#6f7688" font-size="11">-5</text>
  <line x1="534.7" y1="140" x2="534.7" y2="436" stroke="#252c3e" stroke-width="1"/>
  <text x="534.7" y="454" text-anchor="middle" fill="#6f7688" font-size="11">0</text>
  <line x1="608.0" y1="140" x2="608.0" y2="436" stroke="#252c3e" stroke-width="1"/>
  <text x="608.0" y="454" text-anchor="middle" fill="#6f7688" font-size="11">+5</text>
  <line x1="681.3" y1="140" x2="681.3" y2="436" stroke="#252c3e" stroke-width="1"/>
  <text x="681.3" y="454" text-anchor="middle" fill="#6f7688" font-size="11">+10</text>
  <line x1="534.7" y1="140" x2="534.7" y2="436" stroke="#8b93a8" stroke-width="1.5"/>
  <line x1="461.3" y1="140" x2="461.3" y2="436" stroke="#ff8a7a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="461.3" y="474" text-anchor="middle" fill="#ff8a7a" font-size="11.5">gate: lower bound at least -5</text>
  <g class="beat" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;1" keyTimes="0;0.05;0.13;0.97;1"/>
    <text x="288" y="174" text-anchor="end" fill="#e8eaf2" font-size="13" font-weight="600">claude-opus-4-8</text>
    <text x="288" y="191" text-anchor="end" fill="#8b93a8" font-size="11.5">reference</text>
    <circle cx="534.7" cy="176" r="6" fill="none" stroke="#8b93a8" stroke-width="2"/>
    <text x="548.7" y="180" fill="#8b93a8" font-size="11.5">reference</text>
    <rect x="800" y="167" width="320.8" height="18" rx="4" fill="#8b93a8" fill-opacity="0.55"/>
    <text x="1128.8" y="180" fill="#c9cfdd" font-size="12">$0.1458</text>
  </g>
  <g class="beat" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;1" keyTimes="0;0.17;0.25;0.97;1"/>
    <text x="288" y="236" text-anchor="end" fill="#e8eaf2" font-size="13" font-weight="600">claude-opus-5-5</text>
    <text x="288" y="253" text-anchor="end" fill="#8b93a8" font-size="11.5">default effort</text>
    <line x1="388.7" y1="238" x2="680.6" y2="238" stroke="#ff8a7a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="388.7" y1="231" x2="388.7" y2="245" stroke="#ff8a7a" stroke-width="3"/>
    <line x1="680.6" y1="231" x2="680.6" y2="245" stroke="#ff8a7a" stroke-width="3"/>
    <circle cx="534.7" cy="238" r="7" fill="#ff8a7a" stroke="#0b0c13" stroke-width="2"/>
    <text x="752" y="242" fill="#ff8a7a" font-size="11.5" font-weight="600">fails</text>
    <rect x="800" y="229" width="293.9" height="18" rx="4" fill="#ff8a7a" fill-opacity="0.55"/>
    <text x="1101.9" y="242" fill="#c9cfdd" font-size="12">$0.1336</text>
  </g>
  <g class="beat" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;1" keyTimes="0;0.29;0.37;0.97;1"/>
    <text x="288" y="298" text-anchor="end" fill="#e8eaf2" font-size="13" font-weight="600">claude-opus-5-5</text>
    <text x="288" y="315" text-anchor="end" fill="#8b93a8" font-size="11.5">effort low</text>
    <line x1="391.4" y1="300" x2="653.6" y2="300" stroke="#ff8a7a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="391.4" y1="293" x2="391.4" y2="307" stroke="#ff8a7a" stroke-width="3"/>
    <line x1="653.6" y1="293" x2="653.6" y2="307" stroke="#ff8a7a" stroke-width="3"/>
    <circle cx="522.5" cy="300" r="7" fill="#ff8a7a" stroke="#0b0c13" stroke-width="2"/>
    <text x="752" y="304" fill="#ff8a7a" font-size="11.5" font-weight="600">fails</text>
    <rect x="800" y="291" width="276.3" height="18" rx="4" fill="#ff8a7a" fill-opacity="0.55"/>
    <text x="1084.3" y="304" fill="#c9cfdd" font-size="12">$0.1256</text>
  </g>
  <g class="beat" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;1" keyTimes="0;0.41;0.49;0.97;1"/>
    <text x="288" y="360" text-anchor="end" fill="#e8eaf2" font-size="13" font-weight="600">claude-sonnet-5-5</text>
    <text x="288" y="377" text-anchor="end" fill="#8b93a8" font-size="11.5">effort low</text>
    <line x1="467.9" y1="362" x2="711.4" y2="362" stroke="#5ad19a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="467.9" y1="355" x2="467.9" y2="369" stroke="#5ad19a" stroke-width="3"/>
    <line x1="711.4" y1="355" x2="711.4" y2="369" stroke="#5ad19a" stroke-width="3"/>
    <circle cx="589.7" cy="362" r="7" fill="#5ad19a" stroke="#0b0c13" stroke-width="2"/>
    <text x="752" y="366" fill="#5ad19a" font-size="11.5" font-weight="600">pass</text>
    <rect x="800" y="353" width="136.2" height="18" rx="4" fill="#5ad19a" fill-opacity="0.55"/>
    <text x="944.2" y="366" fill="#c9cfdd" font-size="12">$0.0619</text>
  </g>
  <g class="beat" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;1" keyTimes="0;0.53;0.61;0.97;1"/>
    <text x="288" y="422" text-anchor="end" fill="#e8eaf2" font-size="13" font-weight="600">claude-haiku-4-5</text>
    <text x="288" y="439" text-anchor="end" fill="#8b93a8" font-size="11.5">no effort</text>
    <line x1="302.8" y1="424" x2="595.5" y2="424" stroke="#ff8a7a" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="302.8" y1="417" x2="302.8" y2="431" stroke="#ff8a7a" stroke-width="3"/>
    <line x1="595.5" y1="417" x2="595.5" y2="431" stroke="#ff8a7a" stroke-width="3"/>
    <circle cx="449.2" cy="424" r="7" fill="#ff8a7a" stroke="#0b0c13" stroke-width="2"/>
    <text x="752" y="428" fill="#ff8a7a" font-size="11.5" font-weight="600">fails</text>
    <rect x="800" y="415" width="54.6" height="18" rx="4" fill="#ff8a7a" fill-opacity="0.55"/>
    <text x="862.6" y="428" fill="#c9cfdd" font-size="12">$0.0248</text>
  </g>
  <rect x="48" y="512" width="1104" height="60" rx="12" fill="#12151f" stroke="#5ad19a" stroke-opacity="0.45"/>
  <text x="70" y="538" fill="#e8eaf2" font-size="14" font-weight="600">Only claude-sonnet-5-5 at low effort clears the quality bound, at 57.5% lower cost per case than claude-opus-4-8.</text>
  <text x="70" y="558" fill="#8b93a8" font-size="12">The intervals are wide on 60 held-out cases, so the gate asks for the lower bound to clear -5, not the dot.</text>
</svg>
