<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Inter,ui-sans-serif,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="spT spD">
  <title id="spT">Two paths to fewer tokens on a flat-rate subscription</title>
  <desc id="spD">A comparison of two ways distil can reduce tokens for a Claude Code user on a flat-rate plan. The proxy path places distil on the wire between the agent and the provider, so it intercepts OAuth-authenticated traffic; Anthropic's consumer terms restrict automated access on subscription credentials, so distil deliberately runs lossless-only there and measures about 0.27 percent saved. The hook path uses Claude Code's documented PostToolUse extension point: the agent hands its own tool result to distil in-process, gets a smaller one back, and only then sends it upstream, so no proxy sits on the wire and no credential is touched. Because a hook sees each tool result exactly once and cannot rewrite conversation history, compression is append-only by construction and the provider prompt cache survives. Measured on a paired live A and B run, the hook path cut the delivered tool result from 18,214 bytes to 11,178 bytes, a 38.6 percent reduction, and the cost-weighted token equivalent by 68.3 percent, with cache reads still served rather than collapsing to zero, and decisions unchanged on five of five verifiable tasks. On distil's own evaluation corpus the same transform saves 0.00 percent, because savings are shape-dependent.</desc>
  <defs>
    <marker id="spArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7390"/>
    </marker>
    <marker id="spArrOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ad1c9"/>
    </marker>
    <style>
      @keyframes spFade{from{opacity:0}to{opacity:1}}
      @keyframes spRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes spDraw{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
      @keyframes spShrink{from{transform:scaleX(1)}to{transform:scaleX(.614)}}
      @keyframes spPulse{0%,100%{opacity:.55}50%{opacity:1}}
      .spNode{transform-box:fill-box;transform-origin:center;animation:spRise .7s cubic-bezier(.2,.75,.25,1) both}
      .spN1{animation-delay:.05s} .spN2{animation-delay:.18s} .spN3{animation-delay:.31s}
      .spN4{animation-delay:.55s} .spN5{animation-delay:.68s} .spN6{animation-delay:.81s}
      .spWire{stroke-dasharray:80;animation:spDraw .5s ease-out both}
      .spW1{animation-delay:.26s} .spW2{animation-delay:.39s}
      .spW3{animation-delay:.76s} .spW4{animation-delay:.89s}
      .spNote{animation:spFade .6s ease-out both}
      .spNoteA{animation-delay:.45s} .spNoteB{animation-delay:.98s}
      .spBar{transform-box:fill-box;transform-origin:left center;animation:spShrink 1s cubic-bezier(.2,.75,.25,1) 1.1s both}
      .spStrip{animation:spRise .7s cubic-bezier(.2,.75,.25,1) 1.25s both}
      .spDot{animation:spPulse 2.4s ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){
        .spNode,.spWire,.spNote,.spBar,.spStrip,.spDot{animation:none}
        .spWire{stroke-dasharray:none}
      }
    </style>
  </defs>

  <rect width="1200" height="470" fill="#0b0d15"/>

  <!-- ── Path A: the proxy, restricted here ────────────────────────── -->
  <g class="spNote spNoteA">
    <text x="60" y="46" fill="#f2f3f7" font-size="19" font-weight="600">Proxy path</text>
    <text x="176" y="46" fill="#ff8a6b" font-size="13" font-weight="600">restricted on a subscription</text>
  </g>

  <g class="spNode spN1">
    <rect x="60" y="70" width="170" height="66" rx="10" fill="#151826" stroke="#262d4a"/>
    <text x="145" y="98" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">Claude Code</text>
    <text x="145" y="118" fill="#8b91a3" font-size="12" text-anchor="middle">your OAuth session</text>
  </g>

  <g class="spNode spN2">
    <rect x="310" y="70" width="170" height="66" rx="10" fill="#1a1640" stroke="#8b7bff"/>
    <text x="395" y="98" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">distil proxy</text>
    <text x="395" y="118" fill="#8b7bff" font-size="12" text-anchor="middle">on the wire</text>
  </g>

  <g class="spNode spN3">
    <rect x="560" y="70" width="170" height="66" rx="10" fill="#151826" stroke="#262d4a"/>
    <text x="645" y="98" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">Anthropic API</text>
    <text x="645" y="118" fill="#8b91a3" font-size="12" text-anchor="middle">upstream</text>
  </g>

  <line class="spWire spW1" x1="230" y1="103" x2="304" y2="103" stroke="#6b7390" stroke-width="2" marker-end="url(#spArr)"/>
  <line class="spWire spW2" x1="480" y1="103" x2="554" y2="103" stroke="#6b7390" stroke-width="2" marker-end="url(#spArr)"/>

  <g class="spNote spNoteA">
    <text x="770" y="92" fill="#ff8a6b" font-size="13" font-weight="600">Consumer Terms §3(7)</text>
    <text x="770" y="112" fill="#8b91a3" font-size="12">no automated access on subscription credentials</text>
    <text x="770" y="131" fill="#8b91a3" font-size="12">→ distil stays lossless-only here: <tspan fill="#f2f3f7" font-weight="600">0.27% saved</tspan></text>
  </g>

  <line x1="60" y1="176" x2="1140" y2="176" stroke="#252c3e" stroke-width="1"/>

  <!-- ── Path B: the hook, first-party ─────────────────────────────── -->
  <g class="spNote spNoteB">
    <text x="60" y="216" fill="#f2f3f7" font-size="19" font-weight="600">Hook path</text>
    <text x="158" y="216" fill="#5ad1c9" font-size="13" font-weight="600">first-party extension point</text>
  </g>

  <g class="spNode spN4">
    <rect x="60" y="240" width="200" height="96" rx="10" fill="#151826" stroke="#262d4a"/>
    <text x="160" y="268" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">Claude Code</text>
    <text x="160" y="288" fill="#8b91a3" font-size="12" text-anchor="middle">runs a tool</text>
    <text x="160" y="312" fill="#8b91a3" font-size="12" text-anchor="middle">tool_result</text>
    <text x="160" y="329" fill="#ff8a6b" font-size="12" text-anchor="middle" font-weight="600">18,214 B</text>
  </g>

  <g class="spNode spN5">
    <rect x="340" y="240" width="200" height="96" rx="10" fill="#141a2e" stroke="#5ad1c9"/>
    <text x="440" y="266" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">distil hook</text>
    <text x="440" y="285" fill="#5ad1c9" font-size="11.5" text-anchor="middle">PostToolUse · in-process</text>
    <text x="440" y="305" fill="#8b91a3" font-size="11.5" text-anchor="middle">minify JSON · collapse runs</text>
    <text x="440" y="324" fill="#8b91a3" font-size="11.5" text-anchor="middle">lossless · reject-if-bigger</text>
  </g>

  <g class="spNode spN6">
    <rect x="620" y="240" width="200" height="96" rx="10" fill="#151826" stroke="#262d4a"/>
    <text x="720" y="266" fill="#f2f3f7" font-size="14" text-anchor="middle" font-weight="600">Model reads</text>
    <text x="720" y="285" fill="#8b91a3" font-size="11.5" text-anchor="middle">updatedToolOutput</text>
    <rect x="646" y="299" width="148" height="9" rx="4.5" fill="#262d4a"/>
    <rect class="spBar" x="646" y="299" width="148" height="9" rx="4.5" fill="#5ad1c9"/>
    <text x="720" y="329" fill="#5ad1c9" font-size="12" text-anchor="middle" font-weight="600">11,178 B</text>
  </g>

  <line class="spWire spW3" x1="260" y1="288" x2="334" y2="288" stroke="#5ad1c9" stroke-width="2" marker-end="url(#spArrOk)"/>
  <line class="spWire spW4" x1="540" y1="288" x2="614" y2="288" stroke="#5ad1c9" stroke-width="2" marker-end="url(#spArrOk)"/>

  <g class="spNote spNoteB">
    <circle class="spDot" cx="886" cy="257" r="4" fill="#5ad1c9"/>
    <text x="900" y="262" fill="#5ad1c9" font-size="13" font-weight="600">No proxy. No credentials.</text>
    <text x="880" y="286" fill="#8b91a3" font-size="12">Sees each result once and cannot rewrite history,</text>
    <text x="880" y="304" fill="#8b91a3" font-size="12">so compression is append-only by construction</text>
    <text x="880" y="322" fill="#8b91a3" font-size="12">and the prompt cache survives.</text>
  </g>

  <!-- ── Measured strip ────────────────────────────────────────────── -->
  <g class="spStrip">
    <rect x="60" y="372" width="1080" height="62" rx="10" fill="#0c0f1d" stroke="#252c3e"/>
    <text x="84" y="396" fill="#8b91a3" font-size="12" font-weight="600" letter-spacing="0.08em">MEASURED · PAIRED LIVE A/B</text>
    <text x="84" y="420" fill="#f2f3f7" font-size="13"><tspan fill="#5ad1c9" font-weight="600">−38.6%</tspan> tool_result</text>
    <text x="266" y="420" fill="#f2f3f7" font-size="13"><tspan fill="#5ad1c9" font-weight="600">−67.4%</tspan> cache_creation</text>
    <text x="470" y="420" fill="#f2f3f7" font-size="13"><tspan fill="#5ad1c9" font-weight="600">−68.3%</tspan> cost-weighted</text>
    <text x="676" y="420" fill="#f2f3f7" font-size="13"><tspan fill="#5ad1c9" font-weight="600">5/5</tspan> decisions unchanged</text>
    <text x="900" y="420" fill="#f2f3f7" font-size="13"><tspan fill="#ff8a6b" font-weight="600">0.00%</tspan> on distil's own corpus</text>
  </g>

  <text x="60" y="458" fill="#5b6177" font-size="11.5">Savings are shape-dependent: verbose JSON and duplicated log runs compress 25–99%; prose and unique-line output compress ~0%. Figures use the real Anthropic tokenizer.</text>
</svg>
