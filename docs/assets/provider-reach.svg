    <circle cx="34" cy="62" r="6" fill="#5ad19a"/><text x="48" y="66.5"><tspan font-weight="700">compressed</tspan> — Tier-0 + reversible digest, distil_expand answered</text>
    <circle cx="660" cy="62" r="6" fill="#5ad1c9"/><text x="674" y="66.5"><tspan font-weight="700">lossless only</tspan> (Tier-0)</text>
    <circle cx="34" cy="86" r="6" fill="#8b7bff"/><text x="48" y="90.5"><tspan font-weight="700">forwarded untouched</tspan></text>
