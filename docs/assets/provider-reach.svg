  <rect x="470" y="112" width="706" height="110" rx="14" fill="url(#pcard)" stroke="#3a4260" stroke-width="1.4"/><text x="490" y="128" font-size="11.5" letter-spacing="2" font-weight="800" fill="#9aa1b3">DIRECT APIs</text><text x="490" y="151" font-size="13" font-weight="600"><tspan font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="12" fill="#5ad19a" font-weight="700">/v1/messages</tspan><tspan fill="#f2f3f7" dx="4"> Anthropic Messages</tspan></text><rect x="1036" y="136.0" width="124" height="22" rx="11" fill="#5ad19a"/><text x="1098.0" y="151.5" text-anchor="middle" font-size="12" font-weight="800" fill="#06130d">compressed</text><line x1="486" y1="162" x2="1160" y2="162" stroke="#222840"/><text x="490" y="181" font-size="13" font-weight="600"><tspan fill="#f2f3f7">OpenAI Chat Completions + Responses (incl. Azure OpenAI)</tspan></text><rect x="1036" y="166.0" width="124" height="22" rx="11" fill="#5ad19a"/><text x="1098.0" y="181.5" text-anchor="middle" font-size="12" font-weight="800" fill="#06130d">compressed</text><line x1="486" y1="192" x2="1160" y2="192" stroke="#222840"/><text x="490" y="211" font-size="13" font-weight="600"><tspan font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="12" fill="#5ad19a" font-weight="700">generateContent</tspan><tspan fill="#f2f3f7" dx="4"> Gemini</tspan></text><rect x="1036" y="196.0" width="124" height="22" rx="11" fill="#5ad19a"/><text x="1098.0" y="211.5" text-anchor="middle" font-size="12" font-weight="800" fill="#06130d">compressed</text><rect x="470" y="230" width="706" height="190" rx="14" fill="url(#pcard)" stroke="#3a4260" stroke-width="1.4"/><text x="490" y="246" font-size="11.5" letter-spacing="2" font-weight="800" fill="#9aa1b3">AWS BEDROCK</text><text x="490" y="269" font-size="13" font-weight="600"><tspan font-family="JetBrains Mono,ui-monospace,Menlo,monospace" font-size="12" fill="#5ad19a" font-weight="700">/model/{id}/invoke</tspan><tspan fill="#f2f3f7" dx="4"> InvokeModel —