    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c13"/><stop offset="1" stop-color="#06070b"/></linearGradient>
    <linearGradient id="pcard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151f"/><stop offset="1" stop-color="#0b0d15"/></linearGradient>
    <linearGradient id="phero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a2e"/><stop offset="1" stop-color="#0c0f1d"/></linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#5ad1c9"/></linearGradient>
    <pattern id="pdots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity="0.02"/></pattern>
    <marker id="mv" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b7bff"/></marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5ad19a"/></marker>
    <marker id="mt" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5ad1c9"/></marker>
    <style>
      @keyframes flow{to{stroke-dashoffset:-140}}
      @keyframes glow{0%,100%{stroke-opacity:.6}50%{stroke-opacity:1}}
      @keyframes puls{0%,100%{opacity:.5}50%{opacity:1}}
      .fa{animation:flow 2.6s linear infinite}
      .fb{animation:flow 3.4s linear infinite}
      .heroedge{animation:glow 3.6s ease-in-out infinite}
      .dot{animation:puls 2.4s ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){.fa,.fb,.heroedge,.dot{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="724" fill="url(#pbg)"/><rect width="1200" height="724" fill="url(#pdots)"/>
  <text x="24" y="36" font-size="22" font-weight="800" letter-spacing="-0.3" fill="#f2f3f7">Where distil reaches <tspan fill="#9aa1b3" font-weight="500" font-size="16">— provider routes and what happens on each</tspan></text>
