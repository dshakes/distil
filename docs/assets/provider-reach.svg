<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="724" viewBox="0 0 1200 724" font-family="Inter,ui-sans-serif,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="prTitle prDesc">
  <title id="prTitle">Where distil reaches — provider routes and what happens on each</title>
  <desc id="prDesc">Clients on the left, any SDK with a base URL, Claude Code and Codex CLI, send traffic to the distil proxy, which routes each request by provider and path. Direct APIs: Anthropic Messages, OpenAI Chat Completions and Responses including Azure OpenAI, and Gemini generateContent are compressed with Tier-0 lossless transforms plus the reversible digest, with distil_expand answered. AWS Bedrock: InvokeModel at /model/id/invoke is compressed, the model read from the URL; InvokeModel stream at /invoke-with-response-stream is a binary eventstream, relayed unchanged with lossless-only handling and usage read from the frames; Converse and converse-stream are forwarded untouched because the body shape differs; a SigV4-signed request (AWS4-HMAC-SHA256) is refused because the signature covers Host and body and distil holds no AWS credentials, so use a Bedrock API key in AWS_BEARER_TOKEN_BEDROCK. Google Vertex AI: Anthropic on Vertex via rawPredict and streamRawPredict, and Gemini on Vertex via generateContent, are compressed. Codex CLI: distil wrap -- codex applies a session-only model_provider override with supports_websockets false so Codex speaks HTTP Responses, which is compressed; a WebSocket upgrade on GET /v1/responses is answered 426 and never relayed as a plain GET; a ChatGPT-login Codex at chatgpt.com/backend-api/codex is not routable, and wrap says so, so use an API key. Preserved-thinking guards key on the model in the URL on Bedrock and Vertex too.</desc>
