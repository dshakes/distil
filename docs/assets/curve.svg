<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="Inter,ui-sans-serif,Segoe UI,Roboto,sans-serif" aria-label="Fact recall against token savings for each rung of the compression ladder. Reversible rungs hold full recall; the aggressive rung buys savings by losing facts.">
