<circle cx="64.0" cy="40.0" r="5" fill="#5ad19a" stroke="#5ad19a" stroke-width="2"><title>none: 0.0% savings, recall 1.000, reversible · tier-0 only: 0.0% savings, recall 1.000, reversible · subscription: 0.0% savings, recall 1.000, reversible</title></circle>
<text x="74.0" y="30.0" font-size="11" font-weight="700" fill="#dbe0ee" text-anchor="start">none = tier-0 only = subscription</text>
<circle cx="360.9" cy="40.0" r="5" fill="#5ad19a" stroke="#5ad19a" stroke-width="2"><title>lossless: 47.0% savings, recall 1.000, reversible</title></circle>
