<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" role="img" aria-label="Animated distil proof session: distil bench prints GATE PASS (every trajectory certified non-inferior); distil wrap -- claude routes with zero config; a live line shows 53% smaller, equivalence 100%; then the proof ledger closes with 1,284,551 to 601,204 tokens (53.2% smaller), cost $18.41 to $8.72 calibrated to billed usage, 0 shadow decision changes across 63 A/B samples, and 100% recoverable restore.">
  <style>
    /* This one plays ONCE and freezes rather than looping, so the usual
       `animate { display: none }` would leave it permanently blank: every group starts
       at opacity 0, the typed lines are revealed by zero-width clip rects, and the
       result box is drawn by a dash offset. The guard therefore has to assert the END
       state of each, not just stop the motion — a hero image that renders as an empty
       terminal for anyone with reduced motion on is worse than one that animates. */
    @media (prefers-reduced-motion: reduce) {
      animate { display: none }
      g[opacity="0"], rect[opacity="0"] { opacity: 1 }
      clipPath rect { width: 760px }
      rect[stroke-dashoffset] { stroke-dashoffset: 0 }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c13"/><stop offset="1" stop-color="#06070b"/></linearGradient>
    <radialGradient id="vig" cx="0.82" cy="0.02" r="0.95"><stop offset="0" stop-color="#1a1640" stop-opacity="0.5"/><stop offset="1" stop-color="#06070b" stop-opacity="0"/></radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101420"/><stop offset="1" stop-color="#0a0c14"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#5ad1c9"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="t1"><rect x="34" y="72" width="0" height="24"><animate attributeName="width" from="0" to="695" begin="0.2s" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;695"/></rect></clipPath>
    <clipPath id="t2"><rect x="34" y="146" width="0" height="24"><animate attributeName="width" from="0" to="600" begin="1.5s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;600"/></rect></clipPath>
  </defs>

  <rect width="760" height="400" rx="16" fill="url(#bg)"/>
  <rect width="760" height="400" rx="16" fill="url(#vig)"/>

  <rect x="16" y="16" width="728" height="368" rx="14" fill="url(#win)" stroke="#1c2233" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="3" rx="1.5" fill="url(#edge)" opacity="0.9"/>
  <circle cx="42" cy="40" r="6" fill="#ff5f56"/><circle cx="62" cy="40" r="6" fill="#ffbd2e"/><circle cx="82" cy="40" r="6" fill="#27c93f"/>
  <text x="380" y="45" text-anchor="middle" font-size="13" fill="#5a5c70">distil · proof session</text>
  <line x1="16" y1="60" x2="744" y2="60" stroke="#141a28" stroke-width="1"/>

  <!-- L1: bench command (typed) -->
  <g clip-path="url(#t1)" font-size="14">
    <text x="40" y="89"><tspan fill="#5ad1c9">$</tspan><tspan fill="#eaf0ff"> uvx --from distil-llm distil bench</tspan><tspan fill="#5a5c70">  # certificate gate · ~10s · no key</tspan></text>
  </g>
  <!-- L1 out: GATE PASS -->
  <g opacity="0" font-size="14"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.4s" fill="freeze"/>
    <text x="40" y="115"><tspan fill="#7dffc4" font-weight="700">GATE: PASS</tspan><tspan fill="#8a8ca0"> — every trajectory certified non-inferior</tspan></text>
  </g>

  <!-- L2: wrap command (typed) -->
  <g clip-path="url(#t2)" font-size="14">
    <text x="40" y="163"><tspan fill="#5ad1c9">$</tspan><tspan fill="#eaf0ff"> distil wrap -- claude</tspan><tspan fill="#5a5c70">  # zero config → ANTHROPIC_BASE_URL</tspan></text>
  </g>
  <!-- L2 out: live savings -->
  <g opacity="0" font-size="14"><animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.4s" fill="freeze"/>
    <text x="40" y="189"><tspan fill="#5ad1c9">distil</tspan><tspan fill="#7dffc4"> ▾ 75.0K this turn</tspan><tspan fill="#8a8ca0"> · </tspan><tspan fill="#eaf0ff">53% smaller</tspan><tspan fill="#8a8ca0"> · </tspan><tspan fill="#7dffc4">✓ eq 100%</tspan></text>
  </g>

  <!-- proof ledger box -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
    <rect x="36" y="206" width="688" height="162" rx="12" fill="#5ad19a" opacity="0.05" filter="url(#soft)"/>
    <rect x="36" y="206" width="688" height="162" rx="12" fill="none" stroke="#2f6b52" stroke-width="1.4" stroke-dasharray="1700" stroke-dashoffset="1700">
      <animate attributeName="stroke-dashoffset" from="1700" to="0" begin="2.55s" dur="0.85s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1" values="1700;0"/>
    </rect>
    <text x="58" y="238" font-size="14"><tspan fill="#5ad1c9" font-weight="700">distil proof ledger</tspan><tspan fill="#5a5c70"> — session 47m</tspan></text>
  </g>

  <!-- ledger rows (staggered fade-in) -->
  <g font-size="13.5">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.25s" dur="0.35s" fill="freeze"/>
      <text x="58" y="272" fill="#8a8ca0">tokens</text>
      <text x="168" y="272"><tspan fill="#eaf0ff">1,284,551 → </tspan><tspan fill="#eaf0ff" font-weight="700">601,204</tspan></text>
      <text x="470" y="272" fill="#7dffc4">(53.2% smaller)</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.35s" fill="freeze"/>
      <text x="58" y="300" fill="#8a8ca0">cost</text>
      <text x="168" y="300"><tspan fill="#eaf0ff">$18.41 → </tspan><tspan fill="#7dffc4" font-weight="700">$8.72</tspan></text>
      <text x="470" y="300" fill="#5a5c70">calibrated to billed usage</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.75s" dur="0.35s" fill="freeze"/>
      <text x="58" y="328" fill="#8a8ca0">shadow</text>
      <text x="168" y="328"><tspan fill="#7dffc4" font-weight="700">0</tspan><tspan fill="#eaf0ff"> decision changes</tspan></text>
      <text x="470" y="328" fill="#5a5c70">(n=63 A/B · 31 A/A)</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.35s" fill="freeze"/>
      <text x="58" y="356" fill="#8a8ca0">restore</text>
      <text x="168" y="356"><tspan fill="#7dffc4" font-weight="700">100%</tspan><tspan fill="#eaf0ff"> recoverable</tspan></text>
      <text x="470" y="356" fill="#5a5c70">(312 digests, all live)</text>
    </g>
  </g>

  <!-- blinking cursor at the live line -->
  <rect x="392" y="178" width="8" height="15" fill="#7dffc4" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.45s" dur="0.01s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" begin="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
