<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" role="img" aria-label="distil session replay: distil bench prints GATE PASS (every trajectory certified non-inferior, aggressive rejected); distil wrap -- claude routes with zero config; a live savings line shows 62% smaller; then the proof ledger closes with 1,284,551 to 601,204 tokens (53.2% smaller), cost $18.41 to $8.72 calibrated to billed usage, 0 shadow decision changes, and 100% recoverable restore.">
  <defs>
    <linearGradient id="ht-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c13"/><stop offset="1" stop-color="#06070b"/></linearGradient>
    <radialGradient id="ht-vig" cx="0.82" cy="0.02" r="0.9"><stop offset="0" stop-color="#1a1640" stop-opacity="0.45"/><stop offset="1" stop-color="#06070b" stop-opacity="0"/></radialGradient>
    <linearGradient id="ht-win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101420"/><stop offset="1" stop-color="#0a0c14"/></linearGradient>
    <linearGradient id="ht-edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#5ad1c9"/></linearGradient>
    <pattern id="ht-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" opacity="0.02"/></pattern>
    <filter id="ht-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="ht-glow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes ht-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      @keyframes ht-pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes ht-blink{0%,48%{opacity:1}52%,100%{opacity:0}}
      .rise{animation:ht-rise .5s cubic-bezier(.2,.75,.25,1) forwards}
      .r1{animation-delay:.2s}.r2{animation-delay:1.1s}.r3{animation-delay:2.1s}.r4{animation-delay:2.9s}
      .r5{animation-delay:3.6s}.r6{animation-delay:3.85s}.r7{animation-delay:4.05s}.r8{animation-delay:4.25s}
      .r9{animation-delay:4.45s}.r10{animation-delay:4.65s}.rc{animation-delay:5.1s}
      .glow{animation:ht-pulse 3s ease-in-out 4.1s infinite}
      .caret{animation:ht-blink 1.06s steps(1) infinite}
      @media(prefers-reduced-motion:reduce){.rise,.glow,.caret{animation:none}}
    </style>
  </defs>

  <!-- ambient page -->
  <rect width="760" height="380" fill="url(#ht-bg)"/>
  <rect width="760" height="380" fill="url(#ht-dots)"/>
  <rect width="760" height="380" fill="url(#ht-vig)"/>

  <!-- terminal window -->
  <rect x="14" y="12" width="732" height="356" rx="12" fill="url(#ht-win)" stroke="#232a3d" stroke-width="1" filter="url(#ht-shadow)"/>
  <!-- title bar -->
  <circle cx="40" cy="34" r="6" fill="#ff5f57"/><circle cx="60" cy="34" r="6" fill="#febc2e"/><circle cx="80" cy="34" r="6" fill="#28c840"/>
  <text x="380" y="38" text-anchor="middle" font-size="12" fill="#5b6177">distil · proof session</text>
  <line x1="14" y1="54" x2="746" y2="54" stroke="#1b2130" stroke-width="1"/>

  <!-- 1. bench command -->
  <text class="rise r1" x="40" y="88" font-size="14"><tspan fill="#5ad19a">$ </tspan><tspan fill="#e7e9ee">uvx --from distil-llm distil bench</tspan><tspan fill="#667087">  # certificate gate, ~10s, no API key</tspan></text>

  <!-- 2. GATE: PASS -->
  <text class="rise r2" x="40" y="116" font-size="14"><tspan fill="#dbe0ee">GATE: </tspan><tspan fill="#5ad19a" font-weight="700">PASS</tspan><tspan fill="#c9cdd6"> — every trajectory certified non-inferior; aggressive rejected.</tspan></text>

  <!-- 3. wrap command -->
  <text class="rise r3" x="40" y="150" font-size="14"><tspan fill="#5ad19a">$ </tspan><tspan fill="#e7e9ee">distil wrap -- claude</tspan><tspan fill="#667087">  # zero config — preset detected → ANTHROPIC_BASE_URL</tspan></text>

  <!-- 4. live savings status line -->
  <text class="rise r4" x="40" y="178" font-size="14"><tspan fill="#5ad1c9">distil</tspan><tspan fill="#4a5166"> · </tspan><tspan fill="#7fe6ad">▼75.0K</tspan><tspan fill="#4a5166"> · </tspan><tspan fill="#e7e9ee">62% smaller</tspan><tspan fill="#4a5166"> · </tspan><tspan fill="#9aa0b2">total </tspan><tspan fill="#7fe6ad">▼27.0M</tspan><tspan fill="#4a5166"> · </tspan><tspan fill="#5ad19a">✓eq 99.5%</tspan></text>

  <!-- 5. THE CLOSER — proof ledger, glowing winner treatment -->
  <g class="rise r5">
    <rect class="glow" x="28" y="194" width="704" height="152" rx="10" fill="#5ad1c9" opacity="0.06" filter="url(#ht-glow)"/>
    <rect x="28" y="194" width="704" height="152" rx="10" fill="#0c1622" stroke="url(#ht-edge)" stroke-width="1.3"/>
  </g>
  <text class="rise r6" x="52" y="224" font-size="14" font-weight="700" fill="#5ad1c9">distil proof ledger<tspan fill="#8b91a3" font-weight="400"> — session 47m</tspan></text>

  <text class="rise r7" y="252" font-size="14"><tspan x="52" fill="#9aa0b2">tokens</tspan><tspan x="150" fill="#9aa0b2">1,284,551 </tspan><tspan fill="#e7e9ee">→ 601,204</tspan><tspan x="344" fill="#5ad1c9">(53.2% smaller)</tspan></text>
  <text class="rise r8" y="278" font-size="14"><tspan x="52" fill="#9aa0b2">cost</tspan><tspan x="150" fill="#9aa0b2">$18.41 </tspan><tspan fill="#5ad19a">→ $8.72</tspan><tspan x="344" fill="#7b8298">calibrated to your billed usage (n=214)</tspan></text>
  <text class="rise r9" y="304" font-size="14"><tspan x="52" fill="#9aa0b2">shadow</tspan><tspan x="150" fill="#5ad19a">0 decision changes</tspan><tspan x="344" fill="#7b8298">(n=63 A/B · 31 A/A)</tspan></text>
  <text class="rise r10" y="330" font-size="14"><tspan x="52" fill="#9aa0b2">restore</tspan><tspan x="150" fill="#5ad19a">100% recoverable</tspan><tspan x="344" fill="#7b8298">(312 digests, all handles live)</tspan></text>

  <!-- trailing live prompt: caret keeps blinking -->
  <g class="rise rc"><text x="40" y="360" font-size="14" fill="#5ad19a">$ </text><rect class="caret" x="55" y="349" width="8" height="14" fill="#c9cdd6"/></g>
</svg>
