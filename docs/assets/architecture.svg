<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter,ui-sans-serif,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">How Distil works — the request path and the quality contract</title>
  <desc id="archDesc">Agent traffic enters the Distil proxy on localhost. In order: the drift guard serves lossless-only while a proven budget breach is held; the cold-point planner evicts older tool output to recoverable stubs only when the provider's cache has certainly expired; salience pins the load-bearing lines, then Tier-0 lossless transforms and the Tier-1 reversible digest compress the rest; forwarded-bytes prefix replay re-sends last turn's bytes for an unchanged prefix; then the request goes to Anthropic, OpenAI or Gemini. Originals stay in a local RestoreStore that distil_expand recovers from. Every request appends a hash-chained receipt, sealed into segments with Merkle-root checkpoints. Below, the quality contract: the decision-equivalence certificate, live shadow mode feeding an anytime-valid drift alarm that holds the proxy at lossless-only on breach, and the learned keep-model.</desc>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c13"/><stop offset="1" stop-color="#06070b"/></linearGradient>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#5ad1c9"/></linearGradient>
    <linearGradient id="acard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12151f"/><stop offset="1" stop-color="#0b0d15"/></linearGradient>
    <linearGradient id="ahero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a2e"/><stop offset="1" stop-color="#0c0f1d"/></linearGradient>
    <pattern id="adots2" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity="0.02"/></pattern>
    <marker id="aar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7d8cff"/></marker>
    <marker id="aarb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5ad19a"/></marker>
    <style>
      @keyframes flow{to{stroke-dashoffset:-140}}
      @keyframes loopflow{to{stroke-dashoffset:-324}}
      @keyframes puls{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes glow{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
      .fwd{animation:flow 2.6s linear infinite}
      .loop{animation:loopflow 9.5s linear infinite}
      .dot{animation:puls 2.4s ease-in-out infinite}
      .heroedge{animation:glow 3.6s ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){.fwd,.loop,.dot,.heroedge{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="600" fill="url(#abg)"/><rect width="1200" height="600" fill="url(#adots2)"/>

  <text x="48" y="52" font-size="26" font-weight="800" letter-spacing="-0.4" fill="#f2f3f7">How Distil works <tspan fill="#9aa0b2" font-weight="500" font-size="16">— a cache-aware compression pipeline with a quality contract</tspan></text>

  <g font-size="12" letter-spacing="2" font-weight="700" text-anchor="middle"><text x="140" y="94" fill="#7b8298">AGENT</text><text x="600" y="94" fill="#7b8298">DISTIL PROXY · localhost</text><text x="1059" y="94" fill="#7b8298">PROVIDER</text></g>

  <line class="fwd" x1="232" y1="164" x2="316" y2="164" stroke="#7d8cff" stroke-width="2.8" stroke-dasharray="5 9" marker-end="url(#aar)"/>
  <line class="fwd" x1="884" y1="164" x2="966" y2="164" stroke="#7d8cff" stroke-width="2.8" stroke-dasharray="5 9" marker-end="url(#aar)"/>

  <g transform="translate(48,122)"><rect width="184" height="84" rx="14" fill="url(#acard)" stroke="#2c344a"/>
    <text x="18" y="31" font-size="14" font-weight="700" fill="#eef0f5">Claude Code · Codex</text>
    <text x="18" y="51" font-size="14" font-weight="700" fill="#eef0f5">Gemini · any SDK</text>
    <text x="18" y="71" font-size="11" fill="#9aa0b2">re-sends full context every turn</text>
  </g>

  <rect x="320" y="108" width="560" height="296" rx="20" fill="url(#ahero)" stroke="url(#ag)" stroke-width="1.8" class="heroedge"/>
  <text x="600" y="136" text-anchor="middle" font-size="16" font-weight="800" fill="url(#ag)">guard → compress → replay → forward</text>

  <!-- The request path, left to right, in the order the proxy runs it. -->
  <g font-size="12" text-anchor="middle">
    <g><rect x="340" y="150" width="98" height="48" rx="10" fill="#1a1420" stroke="#5a3a4a"/><text x="389" y="172" fill="#dbe0ee" font-weight="700">drift guard</text><text x="389" y="188" fill="#9aa0b2" font-size="10">hold on breach</text></g>
    <g><rect x="445" y="150" width="98" height="48" rx="10" fill="#111726" stroke="#2a3650"/><text x="494" y="172" fill="#dbe0ee" font-weight="700">cold point</text><text x="494" y="188" fill="#9aa0b2" font-size="10">cache expired only</text></g>
    <g><rect x="550" y="150" width="98" height="48" rx="10" fill="#111726" stroke="#2a3650"/><text x="599" y="172" fill="#dbe0ee" font-weight="700">salience</text><text x="599" y="188" fill="#9aa0b2" font-size="10">keeps the needle</text></g>
    <g><rect x="655" y="150" width="98" height="48" rx="10" fill="#111726" stroke="#2a3650"/><text x="704" y="172" fill="#dbe0ee" font-weight="700">Tier-0 · Tier-1</text><text x="704" y="188" fill="#9aa0b2" font-size="10">lossless · digest</text></g>
    <g><rect x="760" y="150" width="98" height="48" rx="10" fill="#111726" stroke="#2a5740"/><text x="809" y="172" fill="#dbe0ee" font-weight="700">prefix replay</text><text x="809" y="188" fill="#9aa0b2" font-size="10">last turn's bytes</text></g>
  </g>
  <g stroke="#3a486a" stroke-width="1.4" fill="none"><path d="M438,174 L445,174"/><path d="M543,174 L550,174"/><path d="M648,174 L655,174"/><path d="M753,174 L760,174"/></g>

  <rect x="340" y="210" width="518" height="34" rx="9" fill="#0e1320" stroke="#2a5740"/>
  <circle class="dot" cx="361" cy="227" r="4" fill="#5ad19a"/>
  <text x="377" y="232" font-size="12.5" fill="#dbe0ee">cache-aware placement — stable prefix billed at the <tspan fill="#6fe0aa" font-weight="700">0.1× cache-read</tspan> rate</text>

  <g transform="translate(340,256)"><rect width="248" height="60" rx="10" fill="#0e1320" stroke="#343f63"/><text x="15" y="25" font-size="13" font-weight="700" fill="#bcacff">RestoreStore</text><text x="15" y="43" font-size="11" fill="#9aa0b2">originals kept locally · 0 tokens on wire</text><text x="15" y="55" font-size="10" fill="#727a92">never sent to the model</text></g>
  <g transform="translate(602,256)"><rect width="256" height="60" rx="10" fill="#0e1320" stroke="#343f63"/><text x="15" y="25" font-size="13" font-weight="700" fill="#5ad1c9">distil_expand</text><text x="15" y="43" font-size="11" fill="#9aa0b2">model recovers any digested detail</text><text x="15" y="55" font-size="10" fill="#727a92">transparent re-query · PAYG</text></g>

  <g transform="translate(340,328)"><rect width="518" height="60" rx="10" fill="#0e1320" stroke="#3a3560"/>
    <text x="15" y="24" font-size="13" font-weight="700" fill="#bcacff">receipt chain</text>
    <text x="118" y="24" font-size="11" fill="#9aa0b2">one hash-linked, content-free receipt per request</text>
    <g font-size="10.5" fill="#dbe0ee">
      <rect x="15" y="34" width="84" height="18" rx="5" fill="#141a2e" stroke="#2c344a"/><text x="57" y="47" text-anchor="middle">segment 0</text>
      <rect x="107" y="34" width="84" height="18" rx="5" fill="#141a2e" stroke="#2c344a"/><text x="149" y="47" text-anchor="middle">segment 1</text>
      <rect x="199" y="34" width="84" height="18" rx="5" fill="#141a2e" stroke="#2a3650" stroke-dasharray="3 3"/><text x="241" y="47" text-anchor="middle" fill="#9aa0b2">active</text>
    </g>
    <text x="298" y="47" font-size="10.5" fill="#9aa0b2">sealed · Merkle-root checkpoint each</text>
  </g>

  <g transform="translate(966,122)"><rect width="186" height="84" rx="14" fill="url(#acard)" stroke="#2c344a"/>
    <text x="18" y="31" font-size="14" font-weight="700" fill="#eef0f5">Anthropic · OpenAI</text>
    <text x="18" y="51" font-size="14" font-weight="700" fill="#eef0f5">Google Gemini</text>
    <text x="18" y="71" font-size="11" fill="#9aa0b2">prompt cache + LLM</text>
  </g>

  <!-- recovery loop: ONE continuous dotted line, provider → expand → agent.
       The label sits on a pill that rides the line, so the line stays connected. -->
  <path class="loop" d="M1059,206 C1059,372 916,432 600,432 C284,432 150,362 140,210" fill="none" stroke="#5ad19a" stroke-width="2.2" stroke-dasharray="0.1 8" stroke-linecap="round" marker-end="url(#aarb)"/>
  <rect x="352" y="420" width="496" height="24" rx="12" fill="#0a0b12" stroke="#21402f"/>
  <text x="600" y="436" text-anchor="middle" font-size="12.5" fill="#7fe6ad">response → transparent expand loop → agent (it just gets the right answer)</text>

  <text x="48" y="490" font-size="12" letter-spacing="2" font-weight="700" fill="#7b8298">THE QUALITY CONTRACT — one risk budget, certified offline, watched live</text>
  <g transform="translate(48,504)"><rect width="360" height="80" rx="14" fill="url(#acard)" stroke="#2c344a"/>
    <circle class="dot" cx="26" cy="31" r="6" fill="#8b7bff"/><text x="44" y="29" font-size="14" font-weight="700" fill="#eef0f5">Decision-Equivalence Certificate</text>
    <text x="20" y="52" font-size="11.5" fill="#9aa0b2">conformal risk control (LTT/CRC) · distribution-free</text>
    <text x="20" y="69" font-size="11.5" fill="#9aa0b2">P(decision-change ≤ α) ≥ 1 − δ</text>
  </g>
  <g transform="translate(420,504)"><rect width="360" height="80" rx="14" fill="url(#acard)" stroke="#2c344a"/>
    <circle class="dot" cx="26" cy="31" r="6" fill="#5ad1c9"/><text x="44" y="29" font-size="14" font-weight="700" fill="#eef0f5">Shadow mode → drift alarm</text>
    <text x="20" y="52" font-size="11.5" fill="#9aa0b2">paired replays feed an anytime-valid e-process</text>
    <text x="20" y="69" font-size="11.5" fill="#9aa0b2">a proven breach holds the guard at lossless-only</text>
  </g>
  <g transform="translate(792,504)"><rect width="360" height="80" rx="14" fill="url(#acard)" stroke="#2c344a"/>
    <circle class="dot" cx="26" cy="31" r="6" fill="#5ad19a"/><text x="44" y="29" font-size="14" font-weight="700" fill="#eef0f5">Learned keep-model — flywheel</text>
    <text x="20" y="52" font-size="11.5" fill="#9aa0b2">every expand is a label; only ever gets</text>
    <text x="20" y="69" font-size="11.5" fill="#9aa0b2">more conservative — never-regressing</text>
  </g>
</svg>
