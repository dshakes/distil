  <line x1="330.0" y1="136" x2="330.0" y2="500" stroke="#252c3e" stroke-width="1"/><text x="330.0" y="128" font-size="11" text-anchor="middle" fill="#7d8598">0%</text><line x1="472.5" y1="136" x2="472.5" y2="500" stroke="#252c3e" stroke-width="1"/><text x="472.5" y="128" font-size="11" text-anchor="middle" fill="#7d8598">25%</text><line x1="615.0" y1="136" x2="615.0" y2="500" stroke="#252c3e" stroke-width="1"/><text x="615.0" y="128" font-size="11" text-anchor="middle" fill="#7d8598">50%</text><line x1="757.5" y1="136" x2="757.5" y2="500" stroke="#252c3e" stroke-width="1"/><text x="757.5" y="128" font-size="11" text-anchor="middle" fill="#7d8598">75%</text><line x1="900.0" y1="136" x2="900.0" y2="500" stroke="#252c3e" stroke-width="1"/><text x="900.0" y="128" font-size="11" text-anchor="middle" fill="#7d8598">100%</text>
