<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="598" viewBox="0 0 1200 598" font-family="Inter,ui-sans-serif,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="vrTitle vrDesc">
  <title id="vrTitle">Visible vs true fact recall, distil and Headroom 0.42</title>
  <desc id="vrDesc">Held-out half of the offline head-to-head, n=180 real tool outputs. For each arm a solid bar is visible recall (facts left in the text the model reads) and a dashed outline is true recall (visible plus facts recoverable through distil_expand or Headroom's retrieval store). distil default · before 86.1% visible, 100.0% true, 13.7% tokens removed; distil default · this release 98.4% visible, 100.0% true, 11.0% tokens removed; Headroom 0.42 default 92.4% visible, 99.1% true, 7.1% tokens removed; Headroom 0.42 coding profile 93.7% visible, 99.1% true, 6.1% tokens removed; distil aggressive · before 55.4% visible, 99.7% true, 41.9% tokens removed; distil aggressive · this release 88.7% visible, 100.0% true, 29.2% tokens removed; Headroom 0.42 agent-90 81.0% visible, 99.3% true, 23.9% tokens removed. Offline token and fact-recall measurements only; not a cost or task-success result.</desc>
  <defs><linearGradient id="vrbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c13"/><stop offset="1" stop-color="#06070b"/></linearGradient></defs>
  <rect width="1200" height="598" fill="url(#vrbg)"/>
